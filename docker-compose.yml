name: standardpilot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./EchoMindFrontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/python
    image: standardpilot-frontend:local
    container_name: standardpilot-frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - standardpilot-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  backend:
    build:
      context: ./EchoMind
      dockerfile: Dockerfile
      target: production
    image: standardpilot-backend:local
    container_name: standardpilot-backend
    env_file:
      - ./.env
    environment:
      APP_NAME: StandardPilot
      REDIS_URL: redis://:${REDIS_PASSWORD:-standardpilot-dev}@redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma-fallback
      PROMETHEUS_PORT: "0"
      EVAL_BASELINE_PATH: /app/data/eval/baseline.json
      STANDARDPILOT_SKILLS_DIR: /app/skills
      ECHOMIND_SKILLS_DIR: /app/skills
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - standardpilot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: standardpilot-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-standardpilot-dev}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-standardpilot-dev}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - standardpilot-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: standardpilot-chromadb
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - standardpilot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/heartbeat >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    container_name: standardpilot-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_UI_PORT:-9090}:9090"
    volumes:
      - ./EchoMind/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - standardpilot-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *default-logging

networks:
  standardpilot-network:
    name: standardpilot-network
    driver: bridge

volumes:
  redis-data:
    name: standardpilot-redis-data
  chromadb-data:
    name: standardpilot-chromadb-data
  prometheus-data:
    name: standardpilot-prometheus-data
