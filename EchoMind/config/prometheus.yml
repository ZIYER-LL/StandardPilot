global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: standardpilot
    environment: docker-compose

scrape_configs:
  - job_name: standardpilot-backend
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - backend:8000
        labels:
          service: standardpilot-backend

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
